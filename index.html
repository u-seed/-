<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Каспи: люстры и бра</title>
<style>
:root{--bg:#14110d;--card:#201b15;--line:#372e23;--tx:#f1ebe2;--mut:#a39887;--acc:#f0b34a;--ok:#4cc38a;--bad:#ef6f5e;--link:#6cb6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:60px}
header{padding:12px 14px 4px}
h1{font-size:19px;margin:0}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}
.tabs{display:flex;gap:6px;padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:10px 2px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:13px;white-space:nowrap;cursor:pointer}
.tab.on{color:#14110d;background:var(--acc);border-color:var(--acc);font-weight:700}
.panel{display:none}.panel.on{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px}
.chip{padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;color:var(--mut);cursor:pointer;user-select:none}
.chip.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 14px}
.ctrl input,.ctrl select,.inp{width:100%;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.ctrl .full{grid-column:1/3}
.chk{display:flex;gap:14px;padding:4px 14px 6px;font-size:13.5px;color:var(--mut);flex-wrap:wrap}
.chk label{display:flex;gap:6px;align-items:center}
.count{padding:2px 14px 8px;color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 12px 10px;padding:12px}
.row{display:flex;gap:12px}
.card img{width:84px;height:84px;object-fit:cover;background:#fff;border-radius:10px;flex:none}
.t{font-weight:600;font-size:14.5px}
.price{font-size:19px;font-weight:700;margin-top:2px}
.old{font-size:12.5px;color:var(--mut);font-weight:400;margin-left:6px;text-decoration:line-through}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.b{background:#17130e;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px}
.b.d{border-color:var(--acc);color:var(--acc);font-weight:700}
.b.new{border-color:var(--ok);color:var(--ok);font-weight:700}
.b.dn{border-color:var(--ok);color:var(--ok)}
.b.up{border-color:var(--bad);color:var(--bad)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{background:#17130e;color:var(--link);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;text-decoration:none;cursor:pointer}
.btn.star{color:var(--acc)}
.more{display:block;margin:6px 12px 14px;text-align:center;padding:11px}
.empty,.note{color:var(--mut);padding:18px 14px;font-size:14px}
.note b{color:var(--tx)}
.ref{border-color:var(--acc)}
.delta{font-size:13px;font-weight:700;margin-top:4px}
.delta.ok{color:var(--ok)}.delta.bad{color:var(--bad)}.delta.eq{color:var(--mut)}
.sec{padding:10px 14px 4px;color:var(--acc);font-weight:700;font-size:14px}
.find{display:flex;gap:8px;padding:8px 14px}
.find .inp{flex:1}
.find .btn{background:var(--acc);color:#14110d;font-weight:700;border-color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Люстры и бра · Kaspi</h1>
  <div class="sub" id="meta">загрузка…</div>
</header>
<div class="tabs">
  <div class="tab on" data-tab="cat">Каталог</div>
  <div class="tab" data-tab="match">Найти такую же</div>
  <div class="tab" data-tab="fav">⭐ <span id="favn">0</span></div>
</div>

<div class="panel on" id="p-cat">
  <div class="chips" id="kinds"></div>
  <div class="chips" id="sizes"></div>
  <div class="ctrl">
    <input class="full" id="q" placeholder="Поиск: название, бренд, цоколь" autocomplete="off">
    <input id="pmin" type="number" inputmode="numeric" placeholder="Цена от">
    <input id="pmax" type="number" inputmode="numeric" placeholder="Цена до" value="100000">
    <select class="full" id="sort">
      <option value="price">Сначала дешёвые</option>
      <option value="new">Сначала новые</option>
      <option value="drop">Сначала подешевевшие</option>
      <option value="diam">Диаметр: большие</option>
    </select>
  </div>
  <div class="chk">
    <label><input type="checkbox" id="onlynew"> 🆕 новые сегодня</label>
    <label><input type="checkbox" id="onlydrop"> ↓ подешевели</label>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>

<div class="panel" id="p-match">
  <div class="note">Вставь ссылку на карточку Kaspi (эталон). Покажу такие же и похожие по фото, от дешёвых к дорогим. Работает по люстрам из нашей базы.</div>
  <div class="find"><input class="inp" id="refin" placeholder="https://kaspi.kz/shop/p/…" autocomplete="off"><button class="btn" id="go">Найти</button></div>
  <div class="ctrl">
    <select class="full" id="thr">
      <option value="25">Только то же фото (строго)</option>
      <option value="55" selected>Такая же модель (средне)</option>
      <option value="85">Похожий вид (широко)</option>
    </select>
  </div>
  <div class="chips" id="msizes"></div>
  <div id="mres"></div>
</div>

<div class="panel" id="p-fav"><div id="flist"></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("ru-RU")+" ₸";
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const KINDS={chandelier:"Люстры",sconce:"Бра"};
let DATA=[],META={},BY={},FAV=load("kl_fav",{}),KIND="all",SIZES=new Set(),MSIZES=new Set(),SHOW=40,REFID=null,MSHOW=40,MRES=[];

/* ---------- данные ---------- */
const bucket=d=>d==null?"?":String(Math.max(10,Math.round(d/10)*10));
const isNew=x=>!META.first_run&&x.first_seen===META.date;
const isDrop=x=>x.prev_price&&x.price<x.prev_price;
async function init(){
  try{
    const r=await fetch("data.json?"+Date.now(),{cache:"no-store"});
    const d=await r.json();
    META=d;DATA=d.items||[];BY={};DATA.forEach(x=>{BY[x.id]=x;x._w=(x.dh||[]).map(words)});
    $("meta").textContent=DATA.length?`Обновлено ${d.generated} · в базе ${DATA.length} (люстр ${d.kinds?d.kinds.chandelier:0}, бра ${d.kinds?d.kinds.sconce:0})`:"База пуста: запусти парсинг (Actions → parse-kaspi → Run workflow)";
  }catch(e){$("meta").textContent="Не удалось загрузить data.json"}
  renderChips();renderCat();renderFav();
}

/* ---------- вкладки ---------- */
function setTab(t){
  document.querySelectorAll(".tab").forEach(e=>e.classList.toggle("on",e.dataset.tab===t));
  document.querySelectorAll(".panel").forEach(e=>e.classList.toggle("on",e.id==="p-"+t));
  if(t==="fav")renderFav();
  window.scrollTo(0,0);
}
document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(t)setTab(t.dataset.tab)});

/* ---------- каталог ---------- */
function renderChips(){
  const kinds=[["all","Все"],["chandelier","Люстры"],["sconce","Бра"]];
  $("kinds").innerHTML=kinds.map(([k,l])=>`<span class="chip ${KIND===k?"on":""}" data-k="${k}">${l}</span>`).join("");
  const pool=DATA.filter(x=>KIND==="all"||x.kind===KIND);
  const cnt={};pool.forEach(x=>{const b=bucket(x.diam);cnt[b]=(cnt[b]||0)+1});
  const keys=Object.keys(cnt).sort((a,b)=>(a==="?")-(b==="?")||a-b);
  $("sizes").innerHTML=keys.map(k=>`<span class="chip ${SIZES.has(k)?"on":""}" data-s="${k}">${k==="?"?"без размера":k+" см"} · ${cnt[k]}</span>`).join("");
}
$("kinds").addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;KIND=c.dataset.k;SIZES.clear();SHOW=40;renderChips();renderCat()});
$("sizes").addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;const s=c.dataset.s;SIZES.has(s)?SIZES.delete(s):SIZES.add(s);SHOW=40;renderChips();renderCat()});

function filtered(){
  const q=$("q").value.trim().toLowerCase(),pmin=+$("pmin").value||0,pmax=+$("pmax").value||Infinity;
  let a=DATA.filter(x=>(KIND==="all"||x.kind===KIND)&&(!SIZES.size||SIZES.has(bucket(x.diam)))&&x.price>=pmin&&x.price<=pmax&&
    (!q||(x.title+" "+(x.brand||"")+" "+(x.socket||"")).toLowerCase().includes(q))&&(!$("onlynew").checked||isNew(x))&&(!$("onlydrop").checked||isDrop(x)));
  const s=$("sort").value;
  if(s==="price")a.sort((x,y)=>x.price-y.price);
  else if(s==="new")a.sort((x,y)=>(y.first_seen||"").localeCompare(x.first_seen||"")||x.price-y.price);
  else if(s==="drop")a.sort((x,y)=>((y.prev_price||0)-y.price)-((x.prev_price||0)-x.price)||x.price-y.price);
  else a.sort((x,y)=>(y.diam||0)-(x.diam||0)||x.price-y.price);
  return a;
}
function card(x,extra){
  const fav=!!FAV[x.id];
  const old=isDrop(x)?`<span class="old">${fmt(x.prev_price)}</span>`:"";
  return `<div class="card" data-id="${x.id}">
    <div class="row">${x.images&&x.images[0]?`<img src="${esc(x.images[0])}" loading="lazy" alt="">`:""}
      <div><div class="t">${esc(x.title)}</div><div class="price">${fmt(x.price)}${old}</div>${extra||""}</div></div>
    <div class="badges">
      ${x.diam?`<span class="b d">⌀ ${x.diam} см</span>`:""}
      ${x.height&&x.kind==="sconce"?`<span class="b">выс. ${x.height} см</span>`:""}
      ${x.lamps?`<span class="b">💡 ${x.lamps} ламп</span>`:""}
      ${x.socket?`<span class="b">${esc(x.socket)}</span>`:""}
      ${x.rating?`<span class="b">★ ${x.rating}</span>`:""}
      <span class="b">${KINDS[x.kind]||""}</span>
      ${isNew(x)?'<span class="b new">🆕 новая</span>':""}
      ${isDrop(x)?`<span class="b dn">↓ −${fmt(x.prev_price-x.price)}</span>`:""}
      ${x.prev_price&&x.price>x.prev_price?`<span class="b up">↑ +${fmt(x.price-x.prev_price)}</span>`:""}
    </div>
    <div class="btns">
      <a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Открыть в Kaspi</a>
      <button class="btn" data-act="sim">Найти такую же</button>
      <button class="btn star" data-act="fav">${fav?"★ в избранном":"☆ в избранное"}</button>
    </div>
  </div>`;
}
function renderCat(){
  const a=filtered();
  $("count").textContent=DATA.length?`Показано: ${Math.min(a.length,SHOW)} из ${a.length} (всего в базе ${DATA.length})`:"";
  $("list").innerHTML=a.length?a.slice(0,SHOW).map(x=>card(x)).join("")+(a.length>SHOW?`<button class="btn more" data-act="more">Показать ещё</button>`:""):'<div class="empty">Ничего не найдено</div>';
}
["q","pmin","pmax","sort","onlynew","onlydrop"].forEach(id=>$(id).addEventListener("input",()=>{SHOW=40;renderCat()}));

/* ---------- избранное ---------- */
function toggleFav(id){
  if(FAV[id])delete FAV[id];
  else{const x=BY[id];if(!x)return;FAV[id]={p:x.price,t:x.title,u:x.url,i:x.images&&x.images[0]||"",d:META.date||""}}
  save("kl_fav",FAV);$("favn").textContent=Object.keys(FAV).length;
}
function renderFav(){
  $("favn").textContent=Object.keys(FAV).length;
  const ids=Object.keys(FAV);
  if(!ids.length){$("flist").innerHTML='<div class="empty">Пока пусто. Нажми «☆ в избранное» на карточке. Здесь будет видно, как изменилась цена с момента добавления.</div>';return}
  const rows=ids.map(id=>({id,f:FAV[id],x:BY[id]})).sort((a,b)=>((a.x?a.x.price-a.f.p:0)-(b.x?b.x.price-b.f.p:0)));
  $("flist").innerHTML=rows.map(({id,f,x})=>{
    if(!x)return `<div class="card" data-id="${id}"><div class="row">${f.i?`<img src="${esc(f.i)}" alt="">`:""}<div><div class="t">${esc(f.t)}</div><div class="price">${fmt(f.p)}</div><div class="delta eq">нет в последней выгрузке (мог закончиться или подорожать выше лимита)</div></div></div><div class="btns"><a class="btn" href="${esc(f.u)}" target="_blank" rel="noopener">Открыть в Kaspi</a><button class="btn star" data-act="fav">★ убрать</button></div></div>`;
    const dl=x.price-f.p;
    const txt=dl<0?`↓ подешевела на ${fmt(-dl)} (была ${fmt(f.p)})`:dl>0?`↑ подорожала на ${fmt(dl)} (была ${fmt(f.p)})`:`цена та же, что при добавлении`;
    return card(x,`<div class="delta ${dl<0?"ok":dl>0?"bad":"eq"}">${txt}</div>`);
  }).join("");
}

/* ---------- найти такую же ---------- */
function words(h){const w=[];for(let i=0;i<h.length;i+=8)w.push(parseInt(h.slice(i,i+8),16)>>>0);return w}
function pc(v){v=v-((v>>>1)&0x55555555);v=(v&0x33333333)+((v>>>2)&0x33333333);return Math.imul((v+(v>>>4))&0x0f0f0f0f,0x01010101)>>>24}
function dist(a,b){let best=Infinity;for(const wa of a._w)for(const wb of b._w){let s=0;for(let i=0;i<wa.length&&s<best;i++)s+=pc((wa[i]^wb[i])>>>0);if(s<best)best=s}return best}
const STOP=new Set(["люстра","люстры","подвесная","потолочная","светильник","шт","кол","во","ламп","лампа","для","и","с","на","бра","настенное"]);
function toks(t){return new Set(String(t).toLowerCase().replace(/[^a-zа-яё0-9]+/g," ").split(" ").filter(w=>w.length>1&&!/^\d+$/.test(w)&&!STOP.has(w)))}
function jac(a,b){if(!a.size||!b.size)return 0;let i=0;a.forEach(w=>{if(b.has(w))i++});return i/(a.size+b.size-i)}
function parseId(s){
  s=(s||"").trim();if(/^\d{5,}$/.test(s))return s;
  const m=s.match(/-(\d{5,})\/?(?:[?#]|$)/)||s.match(/(\d{6,})/);return m?m[1]:null;
}
function findSimilar(id){
  REFID=id;MSIZES.clear();MSHOW=40;
  const ref=BY[id];
  if(!ref){MRES=[];return}
  const thr=+$("thr").value,rt=toks(ref.title),out=[];
  for(const x of DATA){
    if(x.id===id||x.kind!==ref.kind)continue;
    const d=(ref._w.length&&x._w.length)?dist(ref,x):Infinity;
    const t=jac(rt,toks(x.title));
    const score=d-(t>=0.6?10:0);
    if(score<=thr)out.push({x,d,t});
  }
  out.sort((a,b)=>a.x.price-b.x.price);
  MRES=out;
}
function renderMatch(msg){
  const box=$("mres");
  if(msg){box.innerHTML=`<div class="note">${msg}</div>`;$("msizes").innerHTML="";return}
  const ref=BY[REFID];if(!ref){box.innerHTML="";return}
  if(!ref._w.length)return void(box.innerHTML=card(ref)+'<div class="note">У эталона нет хэша фото (картинка не скачалась при парсинге). Сравнение по фото невозможно, обнови базу.</div>');
  const cnt={};MRES.forEach(r=>{const b=bucket(r.x.diam);cnt[b]=(cnt[b]||0)+1});
  const keys=Object.keys(cnt).sort((a,b)=>(a==="?")-(b==="?")||a-b);
  $("msizes").innerHTML=keys.map(k=>`<span class="chip ${MSIZES.has(k)?"on":""}" data-s="${k}">${k==="?"?"без размера":k+" см"} · ${cnt[k]}</span>`).join("");
  const list=MRES.filter(r=>!MSIZES.size||MSIZES.has(bucket(r.x.diam)));
  const cheaper=list.filter(r=>r.x.price<ref.price).length;
  let h=`<div class="sec">Эталон</div><div class="ref">${card(ref)}</div>
    <div class="sec">Найдено: ${list.length}${cheaper?` · дешевле эталона: ${cheaper}`:""}</div>`;
  if(!list.length)h+='<div class="note">Похожих не нашлось. Попробуй режим «Похожий вид (широко)».</div>';
  h+=list.slice(0,MSHOW).map(r=>{
    const dl=r.x.price-ref.price;
    const dtxt=dl<0?`дешевле эталона на ${fmt(-dl)}`:dl>0?`дороже эталона на ${fmt(dl)}`:"цена как у эталона";
    const same=r.d<=20?"то же фото":r.d<=55?"та же модель":"похожий вид";
    const sz=(ref.diam&&r.x.diam&&Math.abs(ref.diam-r.x.diam)>=5)?` · другой размер (${r.x.diam} см)`:"";
    return card(r.x,`<div class="delta ${dl<0?"ok":dl>0?"bad":"eq"}">${dtxt}</div><div class="sub">${same}${sz}</div>`);
  }).join("");
  if(list.length>MSHOW)h+='<button class="btn more" data-act="mmore">Показать ещё</button>';
  box.innerHTML=h;
}
function runMatch(){
  const id=parseId($("refin").value);
  if(!id)return renderMatch("Не нашёл номер товара в ссылке. Нужна ссылка вида <b>kaspi.kz/shop/p/…-123456789/</b>.");
  if(!BY[id]){REFID=null;MRES=[];return renderMatch(`Карточки <b>${id}</b> нет в базе: она дороже лимита, из другой категории или ещё не попала в выгрузку. Запусти парсинг (Actions → parse-kaspi → Run workflow) и вставь эту ссылку в поле <b>ref_url</b>, тогда она добавится как эталон.`)}
  findSimilar(id);renderMatch();
}
$("go").addEventListener("click",runMatch);
$("refin").addEventListener("keydown",e=>{if(e.key==="Enter")runMatch()});
$("thr").addEventListener("change",()=>{if(REFID){findSimilar(REFID);renderMatch()}});
$("msizes").addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;const s=c.dataset.s;MSIZES.has(s)?MSIZES.delete(s):MSIZES.add(s);renderMatch()});

/* ---------- общие клики по карточкам ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,c=b.closest(".card"),id=c&&c.dataset.id;
  if(act==="fav"){toggleFav(id);renderCat();renderFav();if(REFID)renderMatch()}
  else if(act==="sim"){const x=BY[id];if(x){$("refin").value=x.url;findSimilar(id);setTab("match");renderMatch()}}
  else if(act==="more"){SHOW+=40;renderCat()}
  else if(act==="mmore"){MSHOW+=40;renderMatch()}
});
init();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
