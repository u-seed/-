name: parse-kaspi
on:
  workflow_dispatch:
    inputs:
      ref_url:
        description: "Ссылка на карточку-эталон Kaspi (необязательно, добавит её в базу)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/parse.py > parse-out.txt 2>&1 || echo "FAILED" >> parse-out.txt
        env:
          REF_URL: ${{ github.event.inputs.ref_url }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "parse result" || true
          git pull --rebase -q || true
          git push || true
        if: always()
